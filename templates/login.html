<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RK HARDWARE POS & Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e242b 0%, #2c3540 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 410px;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="card login-card border-0 shadow-lg">
        <div class="card-header bg-dark text-center py-4 border-bottom border-warning border-3">
            <h4 class="mb-1 fw-bold text-warning"><i class="bi bi-tools me-2"></i>RK HARDWARE</h4>
            <small class="text-light">Inventory & Point-of-Sale System</small>
        </div>
        <div class="card-body p-4 bg-white">
            {% if error %}
                <div class="alert alert-danger py-2 small fw-semibold">
                    <i class="bi bi-exclamation-circle-fill me-1"></i> {{ error }}
                </div>
            {% endif %}
            {% if message %}
                <div class="alert alert-success py-2 small fw-semibold">
                    <i class="bi bi-check-circle-fill me-1"></i> {{ message }}
                </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning fw-bold text-dark py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to System
                    </button>
                </div>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                <div class="fw-semibold text-dark mb-1">Demo Credentials:</div>
                <div>Manager: <code>admin</code> / <code>admin123</code></div>
                <div>Cashier: <code>cashier</code> / <code>cashier123</code></div>
            </div>
        </div>
    </div>
</body>
</html>
